apis:
- name: Arphie MCP
  description: >-
    Arphie's remote Model Context Protocol server. It exposes Arphie projects, workload and
    project-volume metrics, and the company's agentic chat engine to MCP clients such as
    Claude, ChatGPT, Cursor, an IDE, or a terminal. The endpoint is JSON-RPC over HTTP POST
    and is protected by OAuth 2.1 bearer tokens, with RFC 9728 protected-resource metadata
    advertised in the 401 challenge and a Supabase authorization server behind it that
    supports PKCE and dynamic client registration. Arphie publishes no setup documentation
    for it: the endpoint recorded here was confirmed by probe, not by a published reference.
  humanURL: https://www.arphie.ai/integrations/arphie-mcp
  baseURL: https://app.arphie.ai/api/mcp
