aid: arphie
name: Arphie
description: >-
  Arphie is an AI-powered knowledge activation platform that helps go-to-market teams
  automate RFP (Request for Proposal) responses, security questionnaires, and due-diligence
  questionnaires. Its AI agents draft answers from a company's knowledge base, cite sources
  with confidence scores, and integrate with knowledge sources such as Google Drive, SharePoint,
  Confluence, Notion, Seismic, and Highspot. Arphie is used by high-growth and publicly traded
  companies to win more deals faster while keeping proposal content accurate, current, and
  auditable. The company is SOC 2 Type 2 compliant, operates zero data retention with model
  providers, supports SAML 2.0 SSO and role-based access controls, and is backed by General
  Catalyst. This profile was surfaced as a portfolio lead and enriched by the API Evangelist
  pipeline; Arphie publishes a product and security surface but no public developer API.
