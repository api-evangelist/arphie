x-enrichment:
  date: '2026-08-13'
  status: enriched
  artifacts_added: 13
  pass: local-v1
  note: >-
    No REST API and no OpenAPI (probed /openapi.json, /openapi.yaml, /swagger.json,
    /v1/openapi.json, /api-docs, /docs, /redoc on www., api., app. and docs.arphie.ai — all
    404). STEP 0b contract discovery instead found a live, OAuth-protected remote MCP server
    at https://app.arphie.ai/api/mcp (401 with RFC 9728 resource_metadata; control paths
    404), which is Arphie's real machine-readable surface. tools/list is auth-gated, so tool
    names and inputSchemas are not recorded. No A2A agent card (every /.well-known/* on
    app.arphie.ai is an SPA shell). Pricing is a password-protected 401.
